[project]
name = "khadsetu-backend"
version = "0.1.0"
description = "KhadSetu v2 backend (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pytest>=8.0",
  "httpx>=0.27",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Third-party only: starlette's httpx-based TestClient deprecation (no httpx2
# migration path exists for us). Our own DeprecationWarnings still surface.
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
